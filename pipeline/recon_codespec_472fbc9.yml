job:
  codespec:
    image: ghcr.io/hoomham/xe-tyger-recon:472fbc9f189ce0405a4ffc806fd4bc4c138c1d5b
    buffers:
      inputs: ["input"]
      outputs: ["output"]
    args:
      - --input
      - $(INPUT_PIPE)
      - --output
      - $(OUTPUT_PIPE)
  buffers:

  tags:
    version: 1.0

  nodePool: gpunp

  replicas: 1

cluster: tep-centralus-1

timeoutSeconds: 43200
