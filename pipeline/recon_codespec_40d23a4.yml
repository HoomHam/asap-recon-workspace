job:
  codespec:
    image: ghcr.io/hoomham/xe-tyger-recon:40d23a45aa6da835195025acdcc3e605542ae756
    buffers:
      inputs: ["input"]
      outputs: ["output"]
    args:
      - --input
      - $(INPUT_PIPE)
      - --output
      - $(OUTPUT_PIPE)
  buffers:

  tags:
    version: 1.0

  nodePool: gpunp

  replicas: 1

cluster: tep-centralus-1

timeoutSeconds: 43200
