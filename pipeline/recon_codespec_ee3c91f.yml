job:
  codespec:
    image: ghcr.io/hoomham/xe-tyger-recon:ee3c91ffcb747416a15a9e78b4a784b512c2b048
    buffers:
      inputs: ["input"]
      outputs: ["output"]
    args:
      - --input
      - $(INPUT_PIPE)
      - --output
      - $(OUTPUT_PIPE)
  buffers:

  tags:
    version: 1.0

  nodePool: gpunp

  replicas: 1

cluster: tep-centralus-1

timeoutSeconds: 43200
