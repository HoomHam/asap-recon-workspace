job:
  codespec:
    image: ghcr.io/hoomham/xe-tyger-recon:0209c1a7223e2692c4fb556f71e368d7526206f7
    buffers:
      inputs: ["input"]
      outputs: ["output"]
    args:
      - --input
      - $(INPUT_PIPE)
      - --output
      - $(OUTPUT_PIPE)
  buffers:

  tags:
    version: 1.0

  nodePool: gpunp

  replicas: 1

cluster: tep-centralus-1

timeoutSeconds: 43200
