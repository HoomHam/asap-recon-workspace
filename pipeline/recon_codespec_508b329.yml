job:
  codespec:
    image: ghcr.io/hoomham/xe-tyger-recon:508b3296877a2bacc18e0e2cf9d9a0d797fa52b2
    buffers:
      inputs: ["input"]
      outputs: ["output"]
    args:
      - --input
      - $(INPUT_PIPE)
      - --output
      - $(OUTPUT_PIPE)
  buffers:

  tags:
    version: 1.0

  nodePool: gpunp

  replicas: 1

cluster: tep-centralus-1

timeoutSeconds: 43200
