job:
  codespec:
    image: ghcr.io/hoomham/xe-tyger-recon:6b01071daa989ee4d67b44fe444b07fd0d6704c5
    buffers:
      inputs: ["input"]
      outputs: ["output"]
    args:
      - --input
      - $(INPUT_PIPE)
      - --output
      - $(OUTPUT_PIPE)
  buffers:

  tags:
    version: 1.0

  nodePool: gpunp

  replicas: 1

cluster: tep-centralus-1

timeoutSeconds: 43200
