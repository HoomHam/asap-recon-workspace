job:
  codespec:
    image: ghcr.io/hoomham/xe-tyger-recon:1fe07a04c45ab42e91114595feac20b0de9587dc
    buffers:
      inputs: ["input"]
      outputs: ["output"]
    args:
      - --input
      - $(INPUT_PIPE)
      - --output
      - $(OUTPUT_PIPE)
  buffers:

  tags:
    version: 1.0

  nodePool: gpunp

  replicas: 1

cluster: tep-centralus-1

timeoutSeconds: 43200
