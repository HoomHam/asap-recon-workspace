job:
  codespec:
    image: ghcr.io/hoomham/xe-tyger-recon:db80f16ecc5f53a2af6a44f834c571d619ff09a5
    buffers:
      inputs: ["input"]
      outputs: ["output"]
    args:
      - --input
      - $(INPUT_PIPE)
      - --output
      - $(OUTPUT_PIPE)
  buffers:

  tags:
    version: 1.0

  nodePool: gpunp

  replicas: 1

cluster: tep-centralus-1

timeoutSeconds: 43200
